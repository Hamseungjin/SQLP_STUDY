version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: sqltuning-mysql
    environment:
      MYSQL_DATABASE: sqltuning
      MYSQL_USER: sqltuning
      MYSQL_PASSWORD: sqltuning
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    command:
      - --performance_schema=ON
      - --max_connections=300
      - --innodb_buffer_pool_size=512M
    volumes:
      - mysql_data:/var/lib/mysql

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: sqltuning-oracle
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: sqltuning
      APP_USER_PASSWORD: sqltuning
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata

volumes:
  mysql_data:
  oracle_data: