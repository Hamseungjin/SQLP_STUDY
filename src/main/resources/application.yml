sqltuning:
  practice:
    mode: none # none | load-data | parse-benchmark | index-scan | fetch-size | io-compare

  data-loader:
    target-row-count: 1000000
    batch-size: 5000
    skip-if-exists: true

  parse-benchmark:
    iterations: 12000

  index-scan:
    sample-limit: 3000

  fetch-size:
    small: 10
    large: 1000
    limit: 200000

  io-compare:
    amount-threshold: 10000